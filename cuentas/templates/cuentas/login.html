{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Iniciar sesión</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
          {% endif %}
          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label">Correo electrónico</label>
            <input type="email" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                   class="form-control" value="{{ form.username.value|default_if_none:'' }}" autofocus required>
          </div>
          <div class="mb-3">
            <label for="{{ form.password.id_for_label }}" class="form-label">Contraseña</label>
            <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                   class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
