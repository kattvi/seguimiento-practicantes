<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Seguimiento de practicantes{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'inicio' %}">Seguimiento de practicantes</a>
    {% if user.is_authenticated %}
      <div class="d-flex align-items-center gap-3 text-white">
        {% if user.es_administrador %}
          <a class="link-light text-decoration-none" href="{% url 'practicantes:lista' %}">Practicantes</a>
        {% endif %}
        <span class="small">{{ user.nombre }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>
      </div>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
  {% endfor %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
